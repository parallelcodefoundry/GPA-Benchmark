# GPA-Benchmark on Frontier (AMD MI250X GCD, gfx90a, ROCm 7.0.2): the 9 HIP ports.
# Same schema as driver_apps.yaml; the driver reads this file when its GPU backend is "hip"
# (DriverConfig.gpu_backend / --gpu-backend hip, auto-detected on Frontier) unless a config is
# given explicitly. Build: make [...] OFFLOAD_ARCH=<gfx> (the Makefiles take ROCM_PATH/HIPCC
# from the environment, default /opt/rocm-7.0.2). Kernel files keep their CUDA basenames.
# Setup (data, seeded bfs graph, builds, generated refs + md5 check): scripts/frontier_prepare.sh
#
# Fields beyond driver_apps.yaml:
#   score_regex               anchored regex (Python re.search / ERE) on the demangled rocprofv3
#                             kernel name: every dispatch it matches is target work. It accepts
#                             a return-type prefix ("void "), a namespace and template arguments
#                             ("void xs_lookup_kernel<0>(Inputs, SimulationData)", F2), and a
#                             namespace incl. "(anonymous namespace)::" (fix round 3 H5).
#   rocprof_compute_dispatch  0-based dispatch of the target kernel that rocprof-compute profiles
#                             (GPA's ncu --launch-skip, 0 where GPA has none).
#   profile_run_command       run_command for the profilers when it differs from the scored one.
#   expected_checksum         {regex, value}: exactly one stdout line must match regex and its
#                             group 1 must equal value (replaces pass_check_text "(Valid)").
#   stdout_cap_bytes          max bytes of app stdout kept by the profiler wrappers (every driver
#                             run keeps and validates the full output).
#   fixed_target_dispatches   the optimized run must launch the target exactly as often as the
#                             baseline (xsbench: warmup + iterations), else the run fails.
#   float_grep_all            float_grep compares EVERY occurrence (same count), not only the last.
#   gate_preprocess           {tu, flags}: the translation unit (relative to path) that compiles the
#                             kernel file, and the preprocessor flags; the kernel gate runs
#                             hipcc -E --cuda-host-only on it (fix round 2 F3).
#   test_pairs / final_pairs  J0 protocol: ABBA pairs for gpa_test (6) and the runner's final score (10).
#   level_tol                 J0: per-arm robust spread above which the series is "unstable" (0.025).
#   placement_levels_ms       J0 T5 (bfs, nw): the discrete VRAM-placement levels (ms) of the target.
#   cpu_sigma_s               calibrated std (s) of the CPU-time difference of a pristine pair of
#                             unprofiled runs; G-cpu slack = max(5 sigma / sqrt(pairs), 0.05 s) (F4).
#
# References (reference_output) are GPA-root-relative files under frontier_refs/, outside every
# directory an app runs in; each is md5-verified against frontier_refs.md5 before use.
#
# Timing (hip): rocprofv3 --kernel-trace; per sample the driver reports the summed duration of
# every target dispatch (exec_time/target_ns), the per-kernel totals (all kernels, none excluded
# by name), the wall time and whether that run's output passed the check (every timed run is
# validated). Scoring (driver_rocprof.score_frontier) needs the baseline pass: scored time =
# target + kernels new relative to the baseline + any increase of the baseline's other kernels.

apps:

- name: xsbench
  aliases:
  - XSBench
  kernel_name: xs_lookup_kernel
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*xs_lookup_kernel(?:<.*>)?\('
  rocprof_compute_dispatch: 0
  path: XSBench-hip
  clean_command: make clean
  build_command: make -j 8
  run_command: ./XSBench -m event -s large -l 100000000
  # Profilers run XSBench's default large lookup count (17M; checksum 952131).
  profile_run_command: ./XSBench -m event -s large
  # warmup + timed launch: removing the warmup would halve the summed target time
  fixed_target_dispatches: true
  kernel_file: XSBench-hip/Simulation.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: Simulation.cu, flags: '-x hip -std=c++17'}
  # G-cpu (H1): std 0.0637 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.073
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  # Checksums verified on MI250X (GPA-G1 report A.md): -s large -l 100000000 -> 711949,
  # -s large -> 952131, -s large -l 1000000 -> 995778, -s small -> 945990.
  expected_checksum:
    regex: '^Verification checksum: (\d+)'
    value: 711949

- name: b+tree
  aliases:
  - b_tree
  - btree
  kernel_name: findRangeK
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*findRangeK(?:<.*>)?(?:\(|$)'
  rocprof_compute_dispatch: 0
  path: rodinia/b+tree-hip
  # command_frontier.txt = GPA's command.txt with j 60000 (was 6000): findRangeK >= 500 us.
  # Real semantics (main.cu's parser does not advance past the space): "j 60000 3000" runs
  # findRangeK with count=60000 queries AND rSize=60000 (the second number is ignored), exactly
  # like GPA's "j 6000 3000" ran count=6000, rSize=6000; "k 10000" runs findK with 10000 queries.
  run_command: ./b+tree.out file ../data/b+tree/mil.txt command ./command_frontier.txt
  kernel_file: rodinia/b+tree-hip/kernel/kernel_gpu_cuda_2.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: kernel/kernel_gpu_cuda_wrapper_2.cu, flags: '-x hip'}
  # G-cpu (H1): std 0.0690 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.079
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  extra_files:
  - rodinia/b+tree-hip/kernel/kernel_gpu_cuda_wrapper_2.cu
  reference_output: frontier_refs/b+tree/ref-output.txt
  test_output: rodinia/b+tree-hip/output.txt

- name: backprop
  kernel_name: bpnn_layerforward_CUDA
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*bpnn_layerforward_CUDA(?:<.*>)?\('
  rocprof_compute_dispatch: 0
  path: rodinia/backprop-hip
  run_command: ./backprop 1048560
  kernel_file: rodinia/backprop-hip/backprop_cuda_kernel.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: backprop_cuda.cu, flags: '-x hip'}
  # G-cpu (H1): std 0.0899 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.103
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  extra_files:
  - rodinia/backprop-hip/backprop_cuda.cu
  reference_output: frontier_refs/backprop/ref-output.txt
  float_grep: "sum:"
  float_grep_all: true  # all 16 hidden-unit sums (GPA checked only the last one)
  float_tolerance: 0.01

- name: bfs
  kernel_name: Kernel
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*Kernel(?:<.*>)?\('
  rocprof_compute_dispatch: 8
  path: rodinia/bfs-hip
  run_command: ./bfs ../data/bfs/graph8M.txt
  kernel_file: rodinia/bfs-hip/kernel.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: bfs.cu, flags: '-x hip'}
  # G-cpu (H1): std 0.0803 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.092
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  # J0 T5: the discrete VRAM-placement levels of the summed target time (ms), M.md Q1/Q2
  placement_levels_ms: {F: 13.87, M: 15.45, S: 15.66}
  extra_files:
  - rodinia/bfs-hip/bfs.cu
  reference_output: frontier_refs/bfs/ref-result.txt
  test_output: rodinia/bfs-hip/result.txt
  build_command: make -B -j8

- name: heartwall
  kernel_name: kernel
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*kernel(?:<.*>)?\('
  rocprof_compute_dispatch: 4
  path: rodinia/heartwall-hip
  run_command: ./heartwall ../data/heartwall/test.avi 10
  kernel_file: rodinia/heartwall-hip/kernel.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: main.cu, flags: '-x hip -I./AVI -DOUTPUT'}
  # G-cpu (H1): std 0.0549 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.063
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  extra_files:
  - rodinia/heartwall-hip/main.cu
  reference_output: frontier_refs/heartwall/ref-result.txt
  test_output: rodinia/heartwall-hip/result.txt

- name: hotspot
  kernel_name: calculate_temp
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*calculate_temp(?:<.*>)?\('
  rocprof_compute_dispatch: 0
  path: rodinia/hotspot-hip
  run_command: ./hotspot 1024 5 100 ../data/hotspot/temp_1024 ../data/hotspot/power_1024 output.out
  kernel_file: rodinia/hotspot-hip/hotspot.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: hotspot.cu, flags: '-x hip'}
  # G-cpu (H1): std 0.0350 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.04
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  reference_output: frontier_refs/hotspot/ref-output.out
  test_output: rodinia/hotspot-hip/output.out
  numeric_tolerance: 0.01

- name: nw
  kernel_name: needle_cuda_shared_1
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*needle_cuda_shared_1(?:<.*>)?\('
  rocprof_compute_dispatch: 127
  path: rodinia/nw-hip
  run_command: ./needle 32768 10
  kernel_file: rodinia/nw-hip/needle_kernel.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: needle.cu, flags: '-x hip -DTRACEBACK'}
  # G-cpu (H1): std 0.1038 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.119
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  # J0 T5: the discrete VRAM-placement levels of the summed target time (ms), M.md Q1/Q2
  placement_levels_ms: {fast: 142.1, slow: 156.7}
  extra_files:
  - rodinia/nw-hip/needle.cu
  reference_output: frontier_refs/nw/ref-result.txt
  test_output: rodinia/nw-hip/result.txt

- name: pathfinder
  kernel_name: dynproc_kernel
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*dynproc_kernel(?:<.*>)?\('
  rocprof_compute_dispatch: 2
  path: rodinia/pathfinder-hip
  clean_command: make clean
  build_command: make -j 8
  run_command: ./pathfinder 300000 300 20
  # -DBENCH_PRINT prints the whole 300 x 300000 wall (~180 MB); validated runs keep all of it.
  stdout_cap_bytes: 1048576
  kernel_file: rodinia/pathfinder-hip/pathfinder.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: pathfinder.cu, flags: '-x hip -DBENCH_PRINT'}
  # G-cpu (H1): std 0.0545 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.063
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  reference_output: frontier_refs/pathfinder/ref-result.txt

- name: streamcluster
  kernel_name: kernel_compute_cost
  score_regex: '^(?:\S+ )?(?:(?:\(anonymous namespace\)|[\w]+)::)*kernel_compute_cost(?:<.*>)?\('
  rocprof_compute_dispatch: 300
  path: rodinia/streamcluster-hip
  run_command: ./sc_gpu 10 20 256 131072 131072 16000 none output.txt 1
  kernel_file: rodinia/streamcluster-hip/streamcluster_cuda.cu
  # kernel gate (F3): the app's translation unit that compiles the kernel file, and its flags
  gate_preprocess: {tu: streamcluster_cuda.cu, flags: '-x hip'}
  # G-cpu (H1): std 0.1091 s over 12 pristine PROFILED pairs (MI250X, 2026-09-25), rounded up
  cpu_sigma_s: 0.126
  # J0 protocol (M.md T1/T3): ABBA pairs for gpa_test / the runner's final score, and
  # the per-arm robust-spread tolerance above which a series counts as unstable
  test_pairs: 6
  final_pairs: 10
  level_tol: 0.025
  reference_output: frontier_refs/streamcluster/ref-output.txt
  test_output: rodinia/streamcluster-hip/output.txt
