apps:

- name: ExaTENSOR
  kernel_name: tensor_transpose
  path: ExaTENSOR
  build_command: make -j 8
  run_command: ./main
  replace_file: ExaTENSOR/cuda2.cu
  fail_check_text: Failed!

- name: LULESH
  kernel_name: ApplyMaterialPropertiesAndUpdateVolume_kernel
  path: LULESH
  build_path: LULESH/cuda/src
  build_command: make -f ../build/Makefile -j 8
  run_command: ./lulesh -s 45
  ncu_args: -k ApplyMaterialPropertiesAndUpdateVolume_kernel --launch-skip 49 --launch-count 1
  replace_file: LULESH/cuda/src/lulesh.cu
  reference_output: LULESH/cuda/src/s45-ref-xyz.asc
  test_output: LULESH/cuda/src/xyz.asc

- name: Quicksilver
  kernel_name: CycleTrackingKernel
  path: Quicksilver
  build_path: Quicksilver/src
  build_command: make -j 8
  run_command: ./qs
  ncu_args: -k "CycleTrackingKernel" --launch-skip 49 --launch-count 1
  multiple_replace_options: yes

- name: b+tree
  kernel_name: findRangeK
  path: rodinia/b+tree
  build_command: make -j 8
  run_command: ./b+tree.out file ../data/b+tree/mil.txt command ../data/b+tree/command.txt
  ncu_args: -k findRangeK
  replace_file: rodinia/b+tree/kernel_gpu_cuda_2.cu

- name: backprop
  kernel_name: bpnn_layerforward_CUDA
  path: rodinia/backprop
  build_command: make -j 8
  run_command: ./backprop 65536
  ncu_args: -k bpnn_layerforward_CUDA
  replace_file: rodinia/backprop/backprop_cuda_kernel.cu

- name: bfs
  kernel_name: Kernel
  path: rodinia/bfs
  build_command: make -j 8
  run_command: ./bfs ../data/bfs/graph1MW_6.txt
  ncu_args: -k Kernel --launch-skip 8 --launch-count 1
  replace_file: rodinia/bfs/kernel.cu

- name: gaussian
  kernel_name: Fan2
  path: rodinia/gaussian
  build_command: make -j 8
  run_command: ./gaussian -s 1024
  ncu_args: -k Fan2 --launch-skip 250 --launch-count 1
  replace_file: rodinia/gaussian/gaussian.cu

- name: heartwall
  kernel_name: heartwall_kernel
  path: rodinia/heartwall
  build_command: make -j 8
  run_command: ./heartwall ../data/heartwall/test.avi 10
  ncu_args: --launch-skip 4 --launch-count 1
  replace_file: rodinia/heartwall/kernel.cu

- name: hotspot
  kernel_name: calculate_temp
  path: rodinia/hotspot
  build_command: make -j 8
  run_command: ./hotspot 512 2 2 ../data/hotspot/temp_512 ../data/hotspot/power_512 output.out
  replace_file: rodinia/hotspot/hotspot.cu

- name: huffman
  kernel_name: vlc_encode_kernel_sm64huff
  path: rodinia/huffman
  build_command: make -j 8
  run_command: ./pavle ../data/huffman/test1024_H2.206587175259.in
  ncu_args: -k vlc_encode_kernel_sm64huff --launch-skip 3 --launch-count 1
  replace_file: rodinia/huffman/vlc_kernel_sm64huff.cu

- name: lavaMD
  kernel_name: cuda_compute_flux
  path: rodinia/lavaMD
  build_command: make -j 8
  run_command: ./lavaMD -boxes1d 10
  replace_file: rodinia/lavaMD/kernel_gpu_cuda.cu

- name: lud
  kernel_name: lud_diagonal
  path: rodinia/lud
  build_command: make -j 8
  run_command: ./cuda/lud_cuda -s 256 -v
  ncu_args: -k lud_diagonal --launch-skip 7 --launch-count 1
  replace_file: rodinia/lud/lud_kernel.cu

- name: myocyte
  kernel_name: solver_2
  path: rodinia/myocyte
  build_command: make -j 8
  run_command: ./myocyte.out 100 100 1
  multiple_replace_options: yes

- name: nw
  kernel_name: needle_cuda_shared_1
  path: rodinia/nw
  build_command: make -j 8
  run_command: ./needle 2048 10
  ncu_args: -k needle_cuda_shared_1 --launch-skip 127 --launch-count 1
  replace_file: rodinia/nw/needle_kernel.cu

- name: particlefilter
  kernel_name: likelihood_kernel
  path: rodinia/particlefilter
  build_command: make -j 8
  run_command: ./particlefilter_float -x 128 -y 128 -z 10 -np 1000
  ncu_args: -k likelihood_kernel --launch-skip 2 --launch-count 1
  replace_file: rodinia/particlefilter/ex_particle_CUDA_float_seq.cu

- name: pathfinder
  kernel_name: dynproc_kernel
  path: rodinia/pathfinder
  build_command: make -j 8
  run_command: ./pathfinder 100000 100 20 > result.txt
  ncu_args: --launch-skip 2 --launch-count 1
  replace_file: rodinia/pathfinder/pathfinder.cu

- name: srad_v1
  kernel_name: reduce
  path: rodinia/srad/srad_v1
  build_command: make -j 8
  run_command: ./srad 100 0.5 502 458
  ncu_args: -k "reduce" --launch-skip 99 --launch-count 1
  replace_file: rodinia/srad/srad_v1/reduce_kernel.cu

- name: streamcluster
  kernel_name: kernel_compute_cost
  path: rodinia/streamcluster
  build_command: make -j 8
  run_command: ./sc_gpu 10 20 256 1024 1024 1000 none output.txt 1
  ncu_args: --launch-skip 300 --launch-count 1
  replace_file: rodinia/streamcluster/streamcluster_cuda.cu
