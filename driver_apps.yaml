- name: nw
  kernel_name: needle_cuda_shared_1
  path: rodinia/nw
  run_command: ./needle 2048 10
  ncu_args: -k needle_cuda_shared_1 --launch-skip 127 --launch-count 1
  replace_file: rodinia/nw/needle_kernel.cu
  reference_output: rodinia/nw/ref-result.txt
  test_output: rodinia/nw/result.txt

- name: particlefilter
  kernel_name: likelihood_kernel
  path: rodinia/particlefilter
  run_command: ./particlefilter_float -x 128 -y 128 -z 10 -np 1000
  ncu_args: -k likelihood_kernel --launch-skip 2 --launch-count 1
  replace_file: rodinia/particlefilter/ex_particle_CUDA_float_seq.cu
  reference_output: rodinia/particlefilter/ref-result.txt
  float_grep: "XE:"
  float_grep_2: "YE:"
  float_tolerance: 0.5

- name: pathfinder
  kernel_name: dynproc_kernel
  path: rodinia/pathfinder
  run_command: ./pathfinder 100000 100 20
  ncu_args: --launch-skip 2 --launch-count 1
  replace_file: rodinia/pathfinder/pathfinder.cu
  reference_output: rodinia/pathfinder/ref-result.txt

- name: srad_v1
  kernel_name: reduce
  path: rodinia/srad/srad_v1
  run_command: ./srad 100 0.5 502 458
  ncu_args: -k "reduce" --launch-skip 99 --launch-count 1
  replace_file: rodinia/srad/srad_v1/reduce_kernel.cu
  reference_output: rodinia/srad/srad_v1/ref_image_out.pgm
  test_output: rodinia/srad/srad_v1/image_out.pgm

- name: streamcluster
  kernel_name: kernel_compute_cost
  path: rodinia/streamcluster
  run_command: ./sc_gpu 10 20 256 1024 1024 1000 none output.txt 1
  ncu_args: --launch-skip 300 --launch-count 1
  replace_file: rodinia/streamcluster/streamcluster_cuda.cu
  reference_output: rodinia/streamcluster/ref-output.txt
  test_output: rodinia/streamcluster/output.txt
