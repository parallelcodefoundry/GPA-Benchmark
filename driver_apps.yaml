# Configuration file for proxy apps that the driver can build, run, validate, profile, and test optimizations for.
# All Makefiles support SM_VERSION as a command line argument (e.g., make SM_VERSION=90)
# The environment should have CUDA_HOME set. Rodinia apps are built from rodinia/ with make -j 8.
apps:

- name: ExaTENSOR
  kernel_name: tensor_transpose
  path: ExaTENSOR
  clean_command: make clean
  build_command: make
  run_path: ExaTENSOR/exatensor
  run_command: ./main
  replace_file: ExaTENSOR/cuda2.cu
  fail_check_text: Failed!

- name: LULESH
  kernel_name: ApplyMaterialPropertiesAndUpdateVolume_kernel
  path: LULESH
  build_path: LULESH/cuda/src
  clean_command: make -f ../build/Makefile clean
  build_command: make -f ../build/Makefile -j 8
  run_command: ./lulesh -s 45
  ncu_args: -k ApplyMaterialPropertiesAndUpdateVolume_kernel --launch-skip 49 --launch-count 1
  replace_file: LULESH/cuda/src/lulesh.cu
  reference_output: LULESH/cuda/src/s45-ref-xyz.asc
  test_output: LULESH/cuda/src/xyz.asc

- name: XSBench
  kernel_name: xs_lookup_kernel
  path: XSBench
  build_path: XSBench/cuda
  clean_command: make clean
  build_command: make -j 8
  run_command: ./XSBench -m event -s large
  ncu_args: -k xs_lookup_kernel
  pass_check_text: (Valid)

